id = "exe-dev"
name = "exe.dev"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Persistent exe.dev VMs for clean committed Git worktrees."
platforms = ["linux", "macos"]

[[actions]]
id = "start-agent"
title = "Start worktree VM"
contexts = ["workspace", "pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "reconnect"
title = "Reconnect to worktree VM"
contexts = ["workspace", "pane"]
command = ["node", "src/action.mjs"]

[[actions]]
id = "delete"
title = "Delete worktree VM…"
contexts = ["workspace", "pane"]
command = ["node", "src/action.mjs"]

[[panes]]
id = "provision"
title = "Preparing exe.dev VM"
placement = "split"
command = ["node", "src/provision.mjs"]

[[panes]]
id = "confirm"
title = "Confirm exe.dev deletion"
placement = "split"
command = ["node", "src/confirm.mjs"]
